<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendari Rugby - Segona Catalana Masculina</title>
  <link rel="icon" type="image/png" href="og-image.png" />

  <meta name="description" content="Calendari i classificació de la Segona Catalana Masculina (Federació Catalana de Rugby)." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calendari Rugby - Segona Catalana Masculina" />
  <meta property="og:description" content="Calendari i classificació de la Segona Catalana Masculina (Federació Catalana de Rugby)." />
  <meta property="og:image" content="https://rugbycat-calendari.vercel.app/og-image.png" />
  <meta property="og:url" content="https://rugbycat-calendari.vercel.app/" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Calendari Rugby - Segona Catalana Masculina" />
  <meta name="twitter:description" content="Calendari i classificació de la Segona Catalana Masculina (Federació Catalana de Rugby)." />
  <meta name="twitter:image" content="https://rugbycat-calendari.vercel.app/og-image.png" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-top">
      <header>
        <h1>Calendari - Segona Catalana Masculina</h1>
        <p>Dades de Matchready / rugby.cat (Federació Catalana de Rugby)</p>
      </header>

      <div class="tabs">
        <button class="tab-btn active" data-tab="calendar">Calendari</button>
        <button class="tab-btn" data-tab="classification">Classificació</button>
      </div>

      <div class="controls" id="calendarControls">
        <div class="field team-field">
          <label>Equip</label>
          <button
            type="button"
            id="teamToggle"
            class="secondary team-toggle"
            aria-expanded="false"
            aria-controls="teamGrid"
          >
            <span id="teamToggleLabel">Tots els equips</span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <div id="teamGrid" class="team-grid" role="group" aria-label="Selecciona un equip" hidden></div>
        </div>
        <div class="field">
          <label>Data concreta</label>
          <div class="date-picker-wrap">
            <button type="button" id="dateButton" class="secondary" data-toggle>Tria una jornada</button>
            <button type="button" id="dateClear" class="date-clear" aria-label="Esborra la data concreta" hidden>×</button>
            <input type="hidden" id="date" data-input />
          </div>
        </div>
        <div class="field">
          <button id="search">Cercar</button>
        </div>
        <div class="field">
          <button id="clear" class="secondary">Veure calendari sencer</button>
        </div>
      </div>

      <button
        type="button"
        id="headerCollapseToggle"
        class="header-collapse-toggle"
        aria-expanded="true"
        aria-label="Redueix la capçalera"
      >
        <span class="chevron" aria-hidden="true">▴</span>
      </button>
    </div>

    <main class="app-scroll">
      <section id="calendarTab" class="tab-panel active">
        <div id="status"></div>
        <div id="matches"></div>
      </section>

      <section id="classificationTabPanel" class="tab-panel">
        <div id="classificationStatus"></div>
        <div id="classification"></div>
      </section>

      <footer>
        Font: <a href="https://matchready.es/rugbycat/web/ca/public/calendar/56/37/combined/calendar/" target="_blank" rel="noopener">matchready.es</a>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/cat.js"></script>
  <script src="matchLogic.js"></script>
  <script src="app.js"></script>
</body>
</html>
